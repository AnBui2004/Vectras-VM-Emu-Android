name: Android CI

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    environment: BuildAPK

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create google-services.json
      run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

    - name: Create release-key.jks
      run: echo "${{ secrets.KEYSTORE }}" | base64 --decode > release-key.jks

    - name: Create keystore.properties
      run: |
        cat <<EOF > keystore.properties
        storeFile=../release-key.jks
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        EOF

    - name: Send notification to Telegram
      run: |
        if [[ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]]; then
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} -d message_thread_id=${{ secrets.TELEGRAM_THREAD_ID }} \
            -d $'text=Starting to build Vectras VM on GitHub.\nPlease wait about 5 minutes.\nRun ID: '${GITHUB_RUN_ID}
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Debug APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-release-apk
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload to Telegram 
      run: |
          if [[ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]]; then
            success=true

            for file in app/build/outputs/apk/release/*.apk; do
              echo "Uploading $(basename "$file")"
              tries=0
              success_file=false
              until [ $tries -ge 5 ]; do
                response=$(curl -s -w "\n%{http_code}" --max-time 120 \
                        -F document=@"$file" \
                        -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
                        -d message_thread_id=${{ secrets.TELEGRAM_THREAD_ID }} \
                        -F $'caption=Finished building Vectras VM on GitHub.\nRun ID: '${GITHUB_RUN_ID} \
                        https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument)
                http_code=$(echo "$response" | tail -n1)
                body=$(echo "$response" | sed '$d')

                if [ "$http_code" = "200" ]; then
                  success_file=true
                  break
                else
                  echo "Attempt $((tries+1)) failed (HTTP $http_code): $body"
                  sleep 3
                fi
                tries=$((tries+1))
              done

              if ! $success_file; then
                echo "Upload failed for $file"
                success=false
              fi
            done

            if [ "$success" = false ]; then
              curl -s -o /dev/null -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                  -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} -d message_thread_id=${{ secrets.TELEGRAM_THREAD_ID }} \
                  -d $'text=Something went wrong and Vectras VM\'s apk file could not be uploaded.\nExplore releases here: https://github.com/AnBui2004/Vectras-VM-Emu-Android/releases\nRun ID: '${GITHUB_RUN_ID}
            fi
          fi
