name: Android CI

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    environment: BuildAPK

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create google-services.json
      run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

    - name: Create release-key.jks
      run: echo "${{ secrets.KEYSTORE }}" | base64 --decode > release-key.jks

    - name: Create keystore.properties
      run: |
        cat <<EOF > keystore.properties
        storeFile=../release-key.jks
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        EOF

    - name: Send notification to Telegram
      run: |
        if [[ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]]; then
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} -d message_thread_id=${{ secrets.TELEGRAM_THREAD_ID }} \
            -d $'text=Starting to build Vectras VM on GitHub.\nPlease wait about 5 minutes.\nRun ID: '${GITHUB_RUN_ID}
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug -PversionSuffix="alpha"

    - name: Build Release APK
      run: ./gradlew assembleRelease -PversionSuffix="alpha"

    - name: Upload Debug APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-release-apk
        path: app/build/outputs/apk/release/app-release.apk

    - name: Update Alpha Release
      uses: andelf/nightly-release@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: alpha
        name: 'Alpha $$'
        draft: false
        prerelease: true
        body: |
          This is an unstable version. Scroll down to view stable versions.
          See what's new here: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}
          Run ID: ${{ github.run_id }}
        files: |
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/apk/debug/app-debug.apk

    - name: Notify Telegram with release link
      run: |
        if [[ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]]; then
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} -d message_thread_id=${{ secrets.TELEGRAM_THREAD_ID }} \
            -d $'text=Build complete! Download here: https://github.com/${{ github.repository }}/releases/tag/alpha'
        fi
